# Статика веб-версии Wanmax (образ A7-FE). R-53: код сжат, файлы с хешем — кэш на год,
# главная страница — без кэша (новая версия видна при следующем заходе).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml image/svg+xml application/vnd.ms-fontobject font/ttf font/otf;

  # Файлы сборки с хешем в имени — неизменяемые.
  location /static/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA-роутинг: любые пути, кроме существующих ФАЙЛОВ, → index.html; сама страница — всегда свежая.
  # Без «$uri/»: иначе адрес страницы, совпавший с папкой статики (/knowledge-base — картинки базы
  # знаний), уходил редиректом в каталог и получал 403 при прямом заходе и обновлении.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
